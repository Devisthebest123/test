name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Ensure no RPC key reached the bundle
        run: |
          if grep -rEq "api-key=|helius-rpc|quiknode" dist/assets; then
            echo "secret-looking string found in bundle"; exit 1
          fi
      - name: Ensure vectors are current
        run: |
          npm run vectors
          git diff --exit-code -- docs/test-vectors.json
